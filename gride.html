<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gride_properties</title>
</head>
<body>
    <div class="main">
        <div class="gride">ITs 1st DIV</div>
        <div class="gride">ITS 2nd DIV</div>
        <div class="gride">ITS 3rd DIV</div>
        <div class="gride">ITS 4rd DIV</div>
    </div>
</body>
<style>
    *{
        margin: 0;
        padding: 0;

    }
    body{
        position: relative;
        display: flex;
        height: 100%;
        justify-content: center;
        


    }
.main{
    max-width: 370px;
    width: 100%;
    position: relative;
    justify-content: center;
    background-color: brown;
    display: grid;
    align-items: center;
    max-width: 350px;
    margin-top: 200px;
    
}
.gride{
width: 90px;
height: 80px;


}
</style>
